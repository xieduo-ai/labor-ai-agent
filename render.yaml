# Render 部署配置：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: labor-ai-agent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_API_KEY
        sync: false  # 在 Render 控制台手动填
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: EMBED_API_KEY
        sync: false
      - key: EMBED_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: EMBED_MODEL
        value: BAAI/bge-m3
      - key: RERANK_MODEL
        value: BAAI/bge-reranker-v2-m3
      - key: USE_RERANK
        value: "1"
